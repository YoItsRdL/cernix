# Netlify deploy config for the Cernix landing page.
#
# Runs `landing:build` to produce `landing/dist/style.css` and serves
# everything under `landing/` as the public site. The Electron app
# does not deploy from here: releases go to GitHub Releases (see
# scripts/landing-update-binary.mjs).
#
# No git provider is linked to the site, so nothing here runs on push.
# A merge to `main` publishes nothing and says nothing about it.
#
# Deploy with `npm run landing:deploy`. Not `netlify deploy --prod`:
# that began returning Forbidden for this project while reads, drafts
# and API publishes all kept working, so the script deploys a draft and
# promotes it. See scripts/landing-deploy.mjs.

[build]
  command = "npm run landing:build"
  publish = "landing"

[build.environment]
  # Tailwind 3.x needs Node 18+; pin to a recent LTS so local and
  # CI agree.
  NODE_VERSION = "20"

# Long-cache the compiled stylesheet. `immutable` is a promise that the
# bytes at this URL will never change, and it is kept by the `?v=<hash>`
# the build stamps into the link: a new stylesheet is a new URL.
#
# For a long time it was not kept. The path was a bare `dist/style.css`
# and the header claimed a year, so every returning visitor was pinned
# to whatever stylesheet they first downloaded, and `immutable` stopped
# the browser even revalidating. CSS changes reached new visitors only.
# It surfaced when a dialog shipped without its rules and rendered in
# page flow at the foot of the page.
#
# Short-cache HTML so binary.json and copy edits propagate immediately,
# and so the versioned link itself is picked up on the next visit.
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/binary.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
