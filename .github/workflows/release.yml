name: Release

# Builds Cernix for every platform it supports and attaches all of them
# to one GitHub Release.
#
# This runs in CI rather than locally for the reason it always did:
# releases should be reproducible from a clean checkout rather than from
# whatever state a dev machine is in. Two things make it per-platform
# rather than a single job.
#
# An installer can only be built on the OS it targets. A macOS dmg
# cannot be produced on Linux or Windows at all, and the Windows runner
# additionally has SeCreateSymbolicLinkPrivilege, which a standard
# Windows user does not, and without it electron-builder cannot extract
# its winCodeSign package and the nsis target never completes.
#
# `binary.json` has to describe every published build at once, and
# `landing-update-binary.mjs` reports only the artifacts it can actually
# see in `release/`. A single-OS job can therefore only ever produce a
# single-platform `binary.json`, which is how the landing page came to
# say "no published build" for two platforms that work. Hence the
# publish job: it gathers all three before running that script once.
#
# Builds are unsigned on every platform, by decision. The sha256 of each
# is published in binary.json so downloads can be verified instead.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not delete the others' artifacts: the
      # publish job can still report what did build, and a partial
      # release beats no release when only one target is broken.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: release
            # `smoke` launches the packaged app and needs somewhere to
            # put a window. Windows and macOS runners have one.
            smoke: npm run smoke -- --seconds 25
            artifacts: release/Cernix-Setup-*.exe
          - name: Linux
            os: ubuntu-latest
            script: 'release:linux'
            # xvfb, deliberately, and only here. The CI this replaced
            # booted Electron under xvfb to check the geometry and
            # palette of a Windows-only app, which is a great deal of
            # machinery asserting things about a platform nobody ships
            # to. This is the opposite: the Linux binary, on Linux,
            # asked only whether it starts.
            smoke: xvfb-run -a npm run smoke -- --seconds 25
            artifacts: release/Cernix-*.AppImage
          - name: macOS
            os: macos-latest
            script: 'release:mac'
            smoke: npm run smoke -- --seconds 25
            artifacts: |
              release/Cernix-*.dmg
              release/Cernix-*.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the engines range. Node 26 breaks the Electron
          # install outright: extract-zip emits one entry, the promise
          # never settles, and install.js exits 0 having written no
          # binary, so it surfaces later as something unrelated.
          node-version: '22'
          cache: 'npm'

      - name: Check the tag matches package.json
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION."
            echo "Artifacts are named from package.json, so these must agree."
            exit 1
          fi

      - name: Check the release says what changed
        # Before anything is built, because the cheapest place to find a
        # missing changelog entry is before three platforms compile.
        # Every release page used to carry the same text — which file to
        # download, how to get past the unsigned warning — and nothing
        # about what was different. The account existed in CHANGELOG.md
        # and never reached the page anybody read.
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$VERSION" > /dev/null

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        # better-sqlite3 ships a Node-ABI prebuild; the app needs the
        # Electron ABI. Without this the packaged app starts and fails
        # to open its database.
        run: npx electron-builder install-app-deps

      - name: Build and package
        env:
          # Compiled into the main bundle by vite.config.ts. A build
          # without them still succeeds and ships a working app with
          # Drive disabled, so a fork without secrets is not blocked.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run ${{ matrix.script }}

      - name: Check the shipped macOS bundles are sealed
        # Checks the artifacts, not `release/mac*/Cernix.app`. The first
        # version of this checked the build directory and failed the x64
        # bundle with "a sealed resource is missing or invalid" on
        # better_sqlite3.node — correctly, but about a file nobody
        # downloads: `release:mac` ends with a bare `install-app-deps` to
        # put the host's native modules back, the bundle's copy is
        # hardlinked into node_modules, and that final rebuild rewrites
        # it underneath the signature. The dmg and zip were already made
        # by then, so they were fine and the directory was not.
        #
        # So: verify the thing a user downloads. `codesign --verify` must
        # pass. `spctl` is deliberately not asserted — ad-hoc means
        # signed by nobody, Gatekeeper still refuses it, and claiming
        # otherwise would make this check a lie.
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          shopt -s nullglob

          checked=0
          for zip in release/Cernix-*-*.zip; do
            echo "== $zip"
            work=$(mktemp -d)
            unzip -q "$zip" -d "$work"
            app="$work/Cernix.app"
            test -d "$app/Contents/_CodeSignature" \
              || { echo "::error::$zip ships a bundle with no _CodeSignature"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Signature|Format'
            rm -rf "$work"
            checked=$((checked+1))
          done

          for dmg in release/Cernix-*.dmg; do
            echo "== $dmg"
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            codesign --verify --deep --strict --verbose=2 "$mnt/Cernix.app"
            hdiutil detach "$mnt" >/dev/null
            checked=$((checked+1))
          done

          # A loop over nothing passes silently, which is the shape of
          # green tick that hides a missing build.
          test "$checked" -ge 4 \
            || { echo "::error::expected 4 macOS artifacts to verify, saw $checked"; exit 1; }
          echo "$checked macOS artifacts verified"

      - name: Let Chromium's sandbox helper run
        # Linux only, and only in CI. `chrome-sandbox` must be owned by
        # root with mode 4755 or Electron aborts rather than run
        # unsandboxed — which is the right default and not something to
        # switch off with --no-sandbox just to get a green tick. A fresh
        # checkout cannot have that ownership, so the runner grants it.
        #
        # It does not reproduce on every Linux: a distribution that
        # permits unprivileged user namespaces lets Electron use the
        # namespace sandbox and never reach the SUID helper, which is
        # why the same build smoke-tests clean on Arch and aborted here.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox

      - name: Smoke-test the packaged app
        # Launches the binary and requires it to stay up, write userData
        # and log no startup error. A package that cannot start must not
        # reach a release page. This is where an ABI mismatch surfaces:
        # the app opens its databases here or not at all.
        shell: bash
        run: ${{ matrix.smoke }}

      - name: Hand the artifacts to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: cernix-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: build
    # `needs` alone means "only if every matrix job succeeded", which
    # silently contradicted `fail-fast: false` and the partial-release
    # behaviour described above: one platform failing skipped the
    # publish entirely and a good Windows build went nowhere. This is
    # what actually allows a partial release. Cancellation still stops.
    if: ${{ !cancelled() }}
    # Any runner will do: this one only moves files and writes JSON.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect every platform's build
        uses: actions/download-artifact@v4
        with:
          # Flattened into one `release/`, which is where
          # landing-update-binary.mjs looks. The per-platform artifact
          # names exist only to keep the uploads apart in transit.
          path: release
          merge-multiple: true

      - name: Show what arrived
        run: ls -la release/

      - name: Update binary.json
        # Reports one entry per artifact actually present, and says so
        # for any platform that is missing. With fail-fast off, a target
        # that failed to build simply does not appear, and the landing
        # page keeps offering source for it rather than a dead link.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          node scripts/landing-update-binary.mjs --release-tag "$TAG"
          cat landing/binary.json

      - name: Write the release notes from the changelog
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          node scripts/release-notes.mjs "${VERSION#v}" --out release-notes.md
          echo "--- notes ---"
          head -20 release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/Cernix-Setup-*.exe
            release/Cernix-*.AppImage
            release/Cernix-*.dmg
            release/Cernix-*.zip
            landing/binary.json
          # Not `fail_on_unmatched_files`: with fail-fast off a platform
          # may legitimately be absent, and refusing to publish the ones
          # that did build would make one broken target hold up all of
          # them. The build job already failed loudly for that platform.
          fail_on_unmatched_files: false
          body_path: release-notes.md

      - name: Summary
        run: |
          echo "### Cernix release" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat landing/binary.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`landing/binary.json\` is attached to this release but **not committed**." >> $GITHUB_STEP_SUMMARY
          echo "Commit it to \`main\` to finish the release: the landing deploy serves it" >> $GITHUB_STEP_SUMMARY
          echo "no-cache, so the download buttons repoint once it lands." >> $GITHUB_STEP_SUMMARY
