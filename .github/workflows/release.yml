name: Release

# Builds the Windows installer and attaches it to a GitHub Release.
#
# This runs in CI rather than locally for two reasons. Releases should be
# reproducible from a clean checkout rather than from whatever state a dev
# machine is in, and the runner has SeCreateSymbolicLinkPrivilege, which
# a standard Windows user does not, and without it electron-builder cannot
# extract its winCodeSign package and the nsis target never completes
# (CNX-1753).
#
# Builds are unsigned by decision (CNX-1752). The sha256 is published so
# downloads can be verified instead.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # Must satisfy the engines range. Node 26 breaks the Electron
          # install outright: extract-zip emits one entry, the promise
          # never settles, and install.js exits 0 having written no binary.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        # better-sqlite3 ships a Node-ABI prebuild; the app needs the
        # Electron ABI. Without this the packaged app fails to open its
        # database at startup.
        run: npx electron-builder install-app-deps

      - name: Check the tag matches package.json
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION."
            echo "The installer is named from package.json, so these must agree."
            exit 1
          fi

      - name: Build and package
        env:
          # Compiled into the main bundle by vite.config.ts. A build
          # without them still succeeds and ships a working app with
          # Drive disabled, so a fork without secrets is not blocked.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run release

      - name: Smoke-test the packaged app
        # Launches the binary and requires it to stay up, write userData,
        # and log no startup error. A package that cannot start must not
        # reach a release page.
        run: npm run smoke

      - name: Update binary.json
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          node scripts/landing-update-binary.mjs --release-tag "$TAG"
          cat landing/binary.json

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release/Cernix-Setup-*.exe
            landing/binary.json
          fail_on_unmatched_files: true
          body: |
            Windows installer for Cernix.

            **This build is not code-signed.** Windows SmartScreen will show
            "Windows protected your PC": choose *More info → Run anyway*, or
            verify the download against the sha256 in `binary.json` below.

      - name: Summary
        shell: bash
        run: |
          echo "### Cernix release" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat landing/binary.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`landing/binary.json\` is attached to this release but **not committed**." >> $GITHUB_STEP_SUMMARY
          echo "Commit it to \`main\` to finish the release: Netlify watches that branch, serves" >> $GITHUB_STEP_SUMMARY
          echo "\`landing/\`, and sends \`binary.json\` no-cache, so the download button repoints in ~30s." >> $GITHUB_STEP_SUMMARY
