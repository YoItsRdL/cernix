name: macOS seal check

# A throwaway: builds the macOS bundles and verifies their signatures,
# and publishes nothing.
#
# It exists because the machine this project is developed on is Linux,
# `codesign` is macOS-only, and two releases were already spent finding
# that out the public way — 1.2.1 and 1.2.2 both shipped Windows and
# Linux and no macOS build. A macOS-only fix that cannot be run before
# it is tagged is a fix that gets debugged on the release page.
#
# Written as a throwaway and kept, because it earned it: it caught two
# further signing faults — --deep leaving a stale resource hash, and a
# hand-rolled inside-out order that could not sign a framework whose own
# helper was unsigned — before either reached a release page. It is not a
# gate; the gate lives in release.yml, where it blocks a publish. This is
# the way to exercise a macOS-only change from a Linux machine at all.

on:
  workflow_dispatch:

jobs:
  seal:
    name: Build macOS and verify the seal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx electron-builder install-app-deps
      - name: Build the macOS bundles
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run release:mac

      - name: Verify the shipped artifacts
        run: |
          set -uo pipefail
          shopt -s nullglob
          checked=0
          for zip in release/Cernix-*-*.zip; do
            echo "== $zip"
            work=$(mktemp -d)
            unzip -q "$zip" -d "$work"
            app="$work/Cernix.app"
            test -d "$app/Contents/_CodeSignature" \
              || { echo "::error::$zip has no _CodeSignature"; exit 1; }
            # Which architecture is the native module inside this
            # artifact? The x64 bundle verified at signing time and was
            # invalid by the time it was zipped, and `release:mac` ends
            # with a bare `install-app-deps` that rebuilds
            # better-sqlite3 for the *host* — arm64 on this runner. If
            # an x64 artifact contains an arm64 module, that is the
            # answer and there is nothing left to guess about.
            node_file="$app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
            echo "   better_sqlite3.node: $(lipo -archs "$node_file" 2>/dev/null || file -b "$node_file")"
            codesign --verify --deep --strict --verbose=2 "$app" || echo "   ^ seal failed"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E 'Identifier|Signature|Format'
            rm -rf "$work"; checked=$((checked+1))
          done
          for dmg in release/Cernix-*.dmg; do
            echo "== $dmg"
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            codesign --verify --deep --strict --verbose=2 "$mnt/Cernix.app"
            hdiutil detach "$mnt" >/dev/null; checked=$((checked+1))
          done
          test "$checked" -ge 4 || { echo "::error::only $checked artifacts"; exit 1; }
          echo "$checked macOS artifacts verified"

      - name: Launch it the way a person does
        # The hole that let a crashing build reach a user. `npm run smoke`
        # launches Cernix.app/Contents/MacOS/Cernix — the inner
        # executable, straight from a shell — and that path does not
        # enforce library validation. Opening the *bundle* goes through
        # launchd, which does, and that is where 1.2.3 died:
        #
        #   Library not loaded: @rpath/Electron Framework.framework/...
        #   (non-platform) have different Team IDs
        #
        # Verifying a signature is not the same as running what it
        # signed. This runs it.
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release/Cernix-*-arm64.dmg; do
            mnt=$(mktemp -d); staged=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            # Copied out and de-quarantined, which is what a user ends up
            # with after dragging to Applications.
            cp -R "$mnt/Cernix.app" "$staged/"
            hdiutil detach "$mnt" >/dev/null
            xattr -dr com.apple.quarantine "$staged/Cernix.app" || true

            echo "== launching $(basename "$dmg") through launchd"
            open -a "$staged/Cernix.app" || { echo "::error::open refused the bundle"; exit 1; }
            sleep 12
            if pgrep -f "$staged/Cernix.app/Contents/MacOS/Cernix" >/dev/null; then
              echo "   still running after 12s"
              pkill -f "$staged/Cernix.app/Contents/MacOS/Cernix" || true
            else
              echo "::error::the app did not stay running — it launched and died"
              log show --last 2m --predicate 'process == "Cernix"' 2>/dev/null | tail -30 || true
              exit 1
            fi
            rm -rf "$staged"
          done

      - name: Keep the build so it can be opened on a real Mac
        # The point of the whole workflow. A runner can verify a
        # signature and launch a bundle; it cannot tell you the app is
        # usable. This hands the dmgs back so the person who reported the
        # fault can open the fix before it is tagged, which is the step
        # whose absence turned one macOS defect into three releases.
        #
        # Downloaded through a browser it arrives quarantined and zipped
        # by Actions, so it needs the same xattr line any release does.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cernix-macos-test-build
          path: |
            release/Cernix-*.dmg
            release/Cernix-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: What Gatekeeper would say
        # Expected to refuse: ad-hoc is signed by nobody. Recorded rather
        # than asserted, so the log says plainly what this does and does
        # not buy.
        if: always()
        run: |
          for dmg in release/Cernix-*.dmg; do
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null || continue
            echo "== $dmg"
            spctl --assess --type execute --verbose=4 "$mnt/Cernix.app" 2>&1 | sed 's/^/    /' || true
            hdiutil detach "$mnt" >/dev/null || true
          done
