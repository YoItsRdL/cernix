<meta name="theme-color" content="#171717" /> <!-- design-allow: theme-color must be a literal colour; mirrors --surface-workspace (HSL 0 0% 9%). -->

<!-- The header's brand tile, at tab size. SVG so it stays sharp at any
     scale and can answer prefers-color-scheme; the PNG is for iOS, which
     wants a square it can mask itself and does not read SVG here. -->
<!-- One address per page: the apex serves and www redirects, so a
     crawler or a shared link otherwise sees two. -->
<link rel="canonical" href="{{ canonical }}">
<meta property="og:url" content="{{ canonical }}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Theme, resolved before the first paint. A stored choice wins;
     otherwise the OS preference decides. Inline and synchronous on
     purpose: deferring it shows a frame of the wrong palette. -->
<script>
  (function () {
    // Read apart: localStorage throws in private mode, and that must not
    // also discard the OS preference.
    var saved = null
    try { saved = localStorage.getItem('cernix-theme') } catch (e) { /* private mode */ }
    var dark = false
    try {
      dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches
    } catch (e) { /* no matchMedia: stay light */ }
    if (dark) document.documentElement.classList.add('dark')
  })()
</script>

<link rel="stylesheet" href="dist/style.css?v={{ assetv }}" />
