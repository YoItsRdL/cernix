<meta name="theme-color" content="#171717" /> <!-- design-allow: theme-color must be a literal colour; mirrors --surface-workspace (HSL 0 0% 9%). -->

<!-- The header's brand tile, at tab size. SVG so it stays sharp at any
     scale and can answer prefers-color-scheme; the PNG is for iOS, which
     wants a square it can mask itself and does not read SVG here. -->
<!-- One address per page: the apex serves and www redirects, so a
     crawler or a shared link otherwise sees two. -->
<link rel="canonical" href="{{ canonical }}">
<meta property="og:url" content="{{ canonical }}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Theme, resolved before the first paint. A stored choice wins;
     otherwise the OS preference decides. Inline and synchronous on
     purpose: deferring it shows a frame of the wrong palette. -->
<script>
  (function () {
    // Read apart: localStorage throws in private mode, and that must not
    // also discard the OS preference.
    var saved = null
    try { saved = localStorage.getItem('cernix-theme') } catch (e) { /* private mode */ }
    var dark = false
    try {
      dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches
    } catch (e) { /* no matchMedia: stay light */ }
    if (dark) document.documentElement.classList.add('dark')
  })()
</script>

<!-- The three faces the page draws with, fetched beside the stylesheet
     rather than after it. Found only once style.css is parsed, they
     arrived after the first paint and every line re-set itself in them
     (the flicker on load). Latin only: the Extended files are for
     characters these pages barely use. Same files the stylesheet names. -->
<link rel="preload" href="dist/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="dist/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="dist/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="dist/style.css?v={{ assetv }}" />

<!-- Smoothed wheel scrolling. Not for a visitor who asks for reduced
     motion; without it (or without JavaScript) the page scrolls
     natively. In-page links glide through style.css, not Lenis: its
     `anchors` cancels the jump, so "Skip to content" would stop moving
     focus. Nested scrollers in the mockups keep their own scroll. -->
<script src="dist/lenis.min.js?v={{ lenisv }}" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (!window.Lenis) return
    try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return } catch (e) { /* no matchMedia */ }
    new window.Lenis({ autoRaf: true, allowNestedScroll: true })
  })
</script>
